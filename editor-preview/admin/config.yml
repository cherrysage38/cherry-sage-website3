backend:
  name: github
  repo: rjbryantresreyes-cpu/cherry-sage-website3
  branch: main

site_url: https://cherrysage.com
display_url: https://cherrysage.com
logo_url: https://cherrysage.com/assets/logo-horizontal.png

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "homepage"
    label: "Homepage"
    description: "The words on your homepage, top to bottom. Change any text, then click Save. It goes live in about a minute. The layout, the tarot deck and the Life Path calculator stay as designed."
    files:
      - name: "home"
        label: "Homepage text"
        file: "content/home.yml"
        fields:
          - label: "1. Top of the page"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Small line above the headline", name: "eyebrow", widget: "string" }
              - { label: "Headline (first part)", name: "headline", widget: "string", hint: "The big headline. The second part below shows in gold." }
              - { label: "Headline (gold part)", name: "headline_accent", widget: "string" }
              - { label: "Short intro", name: "intro", widget: "text" }
              - { label: "First button text", name: "button1_label", widget: "string" }
              - { label: "First button goes to", name: "button1_link", widget: "string", hint: "A page like /book-appointment or a full web address." }
              - { label: "Second button text", name: "button2_label", widget: "string" }
              - { label: "Second button goes to", name: "button2_link", widget: "string" }
              - { label: "Three short proof points", name: "trust", widget: "list", field: { label: "Proof point", name: "point", widget: "string" }, hint: "The three small lines under the buttons." }
          - label: "2. Welcome and the three services"
            name: "services"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small line", name: "eyebrow", widget: "string" }
              - { label: "Big quote", name: "heading", widget: "text" }
              - { label: "Paragraph", name: "intro", widget: "text" }
              - label: "The three service cards"
                name: "cards"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Small tag", name: "tag", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "Link text", name: "link_label", widget: "string" }
                  - { label: "Link goes to", name: "link", widget: "string" }
          - label: "3. Questions people bring (the quote cards)"
            name: "situations"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small line", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "text" }
              - { label: "Paragraph", name: "intro", widget: "text" }
              - label: "The quote cards"
                name: "cards"
                widget: "list"
                summary: "{{fields.quote}}"
                fields:
                  - { label: "The question", name: "quote", widget: "string" }
                  - { label: "Link text", name: "label", widget: "string" }
                  - { label: "Link goes to", name: "link", widget: "string", default: "/shop" }
          - label: "4. Your story"
            name: "story"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small line", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "First paragraph", name: "paragraph1", widget: "text" }
              - { label: "Second paragraph", name: "paragraph2", widget: "text" }
              - { label: "Button text", name: "button_label", widget: "string" }
              - { label: "Button goes to", name: "button_link", widget: "string" }
              - { label: "Quote in the card", name: "quote", widget: "text" }
              - { label: "Quote signed by", name: "quote_by", widget: "string" }
          - label: "5. Draw a card (heading only)"
            name: "draw"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small line", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "intro", widget: "text" }
          - label: "6. Free tools"
            name: "free"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small line", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "intro", widget: "text" }
              - label: "The three free tool cards"
                name: "cards"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Small tag", name: "tag", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "Link text", name: "link_label", widget: "string" }
                  - { label: "Link goes to", name: "link", widget: "string" }
          - label: "7. How it works"
            name: "how"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small line", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "The three steps"
                name: "steps"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Step title", name: "title", widget: "string" }
                  - { label: "Step text", name: "text", widget: "text" }
              - { label: "Button text", name: "button_label", widget: "string" }
              - { label: "Button goes to", name: "button_link", widget: "string" }
          - label: "8. Reviews"
            name: "testimonials"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small line", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "intro", widget: "text" }
              - label: "The reviews shown"
                name: "quotes"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Review", name: "quote", widget: "text" }
                  - { label: "Name or place", name: "name", widget: "string" }
                  - { label: "Date", name: "date", widget: "string" }
              - { label: "First button text", name: "button1_label", widget: "string" }
              - { label: "First button goes to", name: "button1_link", widget: "string" }
              - { label: "Second button text", name: "button2_label", widget: "string" }
              - { label: "Second button goes to", name: "button2_link", widget: "string" }
          - label: "9. Closing banner"
            name: "closing"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button text", name: "button_label", widget: "string" }
              - { label: "Button goes to", name: "button_link", widget: "string" }
  - name: "articles"
    label: "Guest Articles"
    label_singular: "Guest Article"
    description: "Add a new guest article, or edit one you already published. Fill in the fields and click Publish — it builds the page and adds it to the Guest Articles list automatically, live on the site in about a minute."
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The article's headline." }
      - { label: "Category", name: "category", widget: "select", hint: "Pick the topic this article belongs to — these are the exact topics shown on the Guest Articles page.", options: ["Abundance", "Astrology", "Business & Spirituality", "Dreams", "Feng Shui", "Herbal Remedies", "Inspiration & Self-Mastery", "Karma", "Meditation", "Metaphysics", "Natural Medicine", "New Age", "Numerology", "Psychic & Paranormal", "Psychic Medium", "Psychic Readings", "Reincarnation", "Tarot", "Wisdom", "Yoga"] }
      - { label: "Author (optional)", name: "author", widget: "string", required: false, hint: "The guest author's name, if there is one." }
      - { label: "Date (optional)", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false, hint: "When it was first published. Shown next to the topic at the top of the article." }
      - { label: "Featured image", name: "image", widget: "image", hint: "This shows on the article card and at the top of the article." }
      - { label: "Article", name: "body", widget: "markdown", hint: "The full article text. Use the toolbar for bold, headings, links." }
      - { label: "Search title (optional)", name: "seo_title", widget: "string", required: false, hint: "The title Google shows in search results. Leave blank and it uses the title above followed by Cherry Sage." }
      - { label: "Search description (optional)", name: "description", widget: "text", required: false, hint: "One or two sentences Google shows under the title. Leave blank and the first lines of the text are used." }

  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    description: "Write a new post for your own blog, or edit one you already published. Fill in the fields and click Publish — it builds the page and adds it to the Blog list automatically, live on the site in about a minute."
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The post's headline." }
      - { label: "Date", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", hint: "Shown on the post and used to sort it into the right month in your Archive list." }
      - { label: "Category", name: "category", widget: "select", hint: "Pick the topic this post belongs to — these are the exact topics shown on your Blog page.", options: ["Psychic Readings", "Numerology", "Other World", "Predicting Dates or Timelines", "Gypsy Scams", "Tarot Card Readings", "Online Psychic Readings", "Karma & Past Lives", "Featured Articles", "Astrology", "Dreams"] }
      - { label: "Author (optional)", name: "author", widget: "string", required: false, hint: "Leave blank to show as written by Cherry Sage." }
      - { label: "Featured image", name: "image", widget: "image", hint: "This shows on the post card and at the top of the post." }
      - { label: "Post", name: "body", widget: "markdown", hint: "The full post text. Use the toolbar for bold, headings, links." }
      - { label: "Search title (optional)", name: "seo_title", widget: "string", required: false, hint: "The title Google shows in search results. Leave blank and it uses the title above followed by Cherry Sage." }
      - { label: "Search description (optional)", name: "description", widget: "text", required: false, hint: "One or two sentences Google shows under the title. Leave blank and the first lines of the text are used." }
      - { label: "Show related posts", name: "related", widget: "boolean", default: true, required: false, hint: "Adds a \"Keep reading\" row of other posts on the same topic under this post." }

  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    description: "Build a brand-new page for the site. Give it a title, then add sections underneath it, like Text, an Image + Text, a Quote, or a Call-to-Action banner, and put them in whatever order you like. Click Publish and it goes live in about a minute at cherrysage.com/[your title, as a web address]."
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Page Title", name: "title", widget: "string", hint: "Shows as the big heading at the top of the page, and sets the page's web address (cherrysage.com/your-title)." }
      - { label: "Search Description", name: "description", widget: "text", hint: "One or two sentences describing the page. This is what shows up under the title in a Google search, it isn't shown on the page itself." }
      - { label: "Small text above the title (optional)", name: "hero_eyebrow", widget: "string", required: false, hint: "A short line above the big heading, e.g. \"For new visitors\"." }
      - { label: "Intro paragraph (optional)", name: "hero_lede", widget: "text", required: false, hint: "A sentence or two right under the title, setting up what the page is about." }
      - label: "Page Sections"
        name: "blocks"
        widget: "list"
        hint: "Add as many sections as you like, in any order. Drag the handle on the left of each to reorder them."
        types:
          - label: "Text"
            name: "text"
            widget: "object"
            summary: "Text — {{fields.heading}}"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "markdown" }
          - label: "Image + Text"
            name: "image_text"
            widget: "object"
            summary: "Image + Text — {{fields.heading}}"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image side", name: "image_position", widget: "select", options: [{ label: "Left", value: "left" }, { label: "Right", value: "right" }], default: "left" }
          - label: "Quote / Testimonial"
            name: "quote"
            widget: "object"
            summary: "Quote — {{fields.name}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role or context (optional)", name: "role", widget: "string", required: false, hint: "e.g. \"Client since 2019\"" }
          - label: "Call-to-Action Banner (text)"
            name: "cta_text"
            widget: "object"
            summary: "CTA — {{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text (optional)", name: "body", widget: "string", required: false }
              - { label: "Button text", name: "button_label", widget: "string", default: "Book a Reading" }
              - { label: "Button link", name: "button_link", widget: "string", default: "/shop", hint: "e.g. /shop, or a full https:// link" }
          - label: "Call-to-Action Banner (image)"
            name: "cta_image"
            widget: "object"
            summary: "Image CTA"
            fields:
              - { label: "Banner image", name: "image", widget: "image", hint: "Design the whole banner as one image, matching the ones already on the site." }
              - { label: "Alt text", name: "alt_text", widget: "string", hint: "Describe what the banner says, for accessibility and search." }
              - { label: "Link", name: "link", widget: "string", default: "/shop" }
          - label: "Feature Cards (3-up)"
            name: "feature_cards"
            widget: "object"
            summary: "Feature Cards — {{fields.heading}}"
            fields:
              - { label: "Small line (optional)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
          - label: "FAQ"
            name: "faq"
            widget: "object"
            summary: "FAQ — {{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string", default: "Frequently Asked Questions" }
              - label: "Questions"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }
          - label: "Gallery"
            name: "gallery"
            widget: "object"
            summary: "Gallery — {{fields.heading}}"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
