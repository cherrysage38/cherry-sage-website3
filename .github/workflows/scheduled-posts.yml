# Scheduled blog posts (Bev, 2026-10-10). Every morning at about 6 AM Eastern this checks whether a blog
# post's date has arrived. If one has, it adds a one-line note to content/.scheduled-log and saves it,
# which makes Netlify rebuild the site and put the post up. On days with nothing due it does nothing.
# Uses only GitHub's own built-in permission for this repository; no keys or secrets.
name: Scheduled posts

on:
  schedule:
    - cron: "7 10 * * *"   # 10:07 UTC = 6:07 AM Eastern in summer, 5:07 AM in winter
  workflow_dispatch: {}     # "Run workflow" button, to release a due post by hand

permissions:
  contents: write

concurrency:
  group: scheduled-posts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --no-audit --no-fund || npm install js-yaml --no-save --no-audit --no-fund
      - id: due
        run: |
          out="$(node scripts/release-scheduled.js)"
          echo "$out"
          if [ "$out" != "Nothing due today." ]; then echo "titles=$out" >> "$GITHUB_OUTPUT"; fi
      - if: steps.due.outputs.titles != ''
        env:
          TITLES: ${{ steps.due.outputs.titles }}
        run: |
          git config user.name "Cherry Sage scheduler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/.scheduled-log
          git commit -m "Scheduled post goes live: $TITLES"
          git push
