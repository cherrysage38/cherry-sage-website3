story:
  eyebrow: A sacred gift
  heading: The Intuitive Connection
  paragraph1: People always ask me when it started, and I think they're expecting some big dramatic moment. But there wasn't one, not really. I was a kid who just knew things. I knew who was on the phone before anybody picked it up, I could walk into a room and feel that something was wrong even when everyone was smiling at me, and every so often I'd hear something, clear as a bell, that turned out to be true a few days later. I thought everybody could do that. So I didn't say much about it, and for a long time I tried to ignore it, because it didn't fit into a normal life and I wanted a normal life. But it doesn't go away just because you ignore it. It gets LOUDER. And at some point I stopped fighting it and started listening, and that's how it became what I do now, helping people see what's really going on in their lives so they can make their own choices.
  paragraph2: Hi. I'm glad you're here. I am Cherry Sage. Spin Magazine found my site in 1999 and invited me to be their "Ask the Expert" guest.
  button_label: Meet Cherry →
  button_link: /meet
  quote: '"90% of my client base are repeat callers. I offer the truth with compassion and responsibility."'
  quote_by: — Cherry Sage
