<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Shop — Cherry Sage</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6E1A28">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=45">
<link rel="icon" href="assets/favicon.ico?v=2" sizes="any">
<style>
body{background:var(--paper)}
.sa-wrap{max-width:820px;margin:0 auto;padding:2.5rem 1.5rem}
.sa-gate{max-width:380px;margin:5rem auto;text-align:center;padding:2.2rem;background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.sa-gate input{width:100%;padding:.8rem 1rem;border:1px solid var(--line-strong);border-radius:10px;margin:1rem 0;text-align:center;font-size:1.2rem;letter-spacing:.2em;box-sizing:border-box}
.sa-gate .msg{color:var(--cherry);font-size:.85rem;min-height:1.2em;margin-top:.6rem}
.sa-title{font-family:var(--font-display);color:var(--oxblood);font-size:1.6rem;margin:0 0 .3rem}
.sa-sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 1.6rem}
.sa-group{margin-bottom:2.2rem}
.sa-group h3{font-size:.95rem;color:var(--oxblood);text-transform:uppercase;letter-spacing:.06em;margin:0 0 .8rem}
.sa-row{display:grid;grid-template-columns:1fr 130px 90px 90px;gap:.6rem;align-items:center;
  padding:.7rem 1rem;border:1px solid var(--line-strong);border-radius:10px;background:var(--cream);margin-bottom:.5rem}
.sa-row input[type=text]{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;font-family:var(--font-body);width:100%;box-sizing:border-box}
.sa-price{display:flex;align-items:center;gap:.2rem}
.sa-price span{color:var(--ink-soft)}
.sa-price input{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;width:100%;box-sizing:border-box}
.sa-save{background:var(--oxblood);color:#fff;border:0;border-radius:8px;padding:.5rem .8rem;cursor:pointer;font-size:.82rem}
.sa-save:disabled{opacity:.5;cursor:default}
.sa-active{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--ink-soft)}
.sa-status{font-size:.78rem;margin-top:.3rem;min-height:1.1em}
.sa-status.ok{color:var(--sage)}
.sa-status.err{color:var(--cherry)}
@media (max-width:640px){.sa-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="sa-wrap">

  <div id="saGate" class="sa-gate">
    <p class="eyebrow" style="color:var(--gold)">Cherry Sage</p>
    <h1 class="sa-title">Manage Shop</h1>
    <p style="color:var(--ink-soft);font-size:.9rem">Enter your dashboard PIN.</p>
    <input type="password" inputmode="numeric" id="saGatePin" placeholder="PIN" autocomplete="off">
    <button class="btn btn-primary" id="saGateSend" style="width:100%">Open</button>
    <p class="msg" id="saGateMsg" style="color:var(--cherry);font-size:.85rem"></p>
    <p style="margin:.9rem 0 0;font-size:.85rem;color:var(--ink-soft)">Already logged in with your account? <a href="/login.html">Log in here</a>, then reload this page.</p>
  </div>

  <div id="saApp" hidden>
    <h1 class="sa-title">Manage Shop &amp; Prices</h1>
    <p class="sa-sub">Change a name or price, then click Save on that row. Changes go live right away, no code needed.</p>
    <div id="saGroups"><p style="color:var(--ink-soft)">Loading…</p></div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  function getPin(){ try{ return sessionStorage.getItem('cs_dash_pin')||''; }catch(e){ return ''; } }
  function setPin(p){ try{ sessionStorage.setItem('cs_dash_pin', p); }catch(e){} }
  function money(cents){ return ((cents||0)/100).toFixed(2); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var ownerToken='';
  var OWNER_EMAILS=['cherry38@cherrysage.com','admin@cherrysage.com'];
  var sb=window.supabase.createClient(
    'https://ctoeuikxoqlhnebgsygp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0b2V1aWt4b3FsaG5lYmdzeWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODM4NTMsImV4cCI6MjA5NjA1OTg1M30.Cy0uf8hm-Biea7a1V3bLQBz70f1oyhP83vHDjefTce8',
    {db:{schema:'cherry_sage'}}
  );
  function adminHeaders(){ return ownerToken ? {'Authorization':'Bearer '+ownerToken} : {'x-dashboard-pin':getPin()}; }

  var gate=document.getElementById('saGate'), app=document.getElementById('saApp');

  function renderProducts(products){
    var groups={ minutes: [], reports: [] };
    products.forEach(function(p){ (p.duration_minutes!=null ? groups.minutes : groups.reports).push(p); });
    var html='';
    [['minutes','Buy Minutes'], ['reports','Numerology Reports']].forEach(function(pair){
      var key=pair[0], label=pair[1], list=groups[key];
      if(!list.length) return;
      html += '<div class="sa-group"><h3>'+label+'</h3>';
      html += list.map(function(p){
        return '<div class="sa-row" data-id="'+p.id+'">'+
          '<input type="text" class="sa-name" value="'+esc(p.name)+'">'+
          '<div class="sa-price">$<input type="text" class="sa-priceval" value="'+money(p.price_cents)+'"></div>'+
          '<label class="sa-active"><input type="checkbox" class="sa-activeval" '+(p.active?'checked':'')+'> Active</label>'+
          '<button class="sa-save" type="button">Save</button>'+
        '</div><p class="sa-status" data-status-for="'+p.id+'"></p>';
      }).join('');
      html += '</div>';
    });
    document.getElementById('saGroups').innerHTML = html || '<p style="color:var(--ink-soft)">No products found.</p>';
  }

  function loadProducts(){
    fetch('/.netlify/functions/shop-admin', { headers:adminHeaders() })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
      .then(function(res){
        if(!res.ok){ document.getElementById('saGroups').innerHTML='<p style="color:var(--cherry)">Could not load products.</p>'; return; }
        renderProducts(res.data.products || []);
      });
  }

  document.getElementById('saGroups').addEventListener('click', function(e){
    var btn=e.target.closest('.sa-save'); if(!btn) return;
    var row=btn.closest('.sa-row');
    var id=row.getAttribute('data-id');
    var name=row.querySelector('.sa-name').value.trim();
    var priceStr=row.querySelector('.sa-priceval').value.trim();
    var active=row.querySelector('.sa-activeval').checked;
    var priceCents=Math.round(parseFloat(priceStr)*100);
    var statusEl=document.querySelector('[data-status-for="'+id+'"]');
    if(!name || isNaN(priceCents) || priceCents<0){
      statusEl.className='sa-status err'; statusEl.textContent='Enter a valid name and price.'; return;
    }
    btn.disabled=true; btn.textContent='Saving…'; statusEl.className='sa-status'; statusEl.textContent='';
    fetch('/.netlify/functions/shop-admin', {
      method:'POST', headers:Object.assign({'content-type':'application/json'},adminHeaders()),
      body: JSON.stringify({ id:id, name:name, priceCents:priceCents, active:active })
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
      .then(function(res){
        btn.disabled=false; btn.textContent='Save';
        if(!res.ok){ statusEl.className='sa-status err'; statusEl.textContent=(res.data&&res.data.error)||'Could not save.'; return; }
        statusEl.className='sa-status ok'; statusEl.textContent='Saved.';
        setTimeout(function(){ statusEl.textContent=''; }, 2500);
      }).catch(function(){
        btn.disabled=false; btn.textContent='Save';
        statusEl.className='sa-status err'; statusEl.textContent='Something went wrong, please try again.';
      });
  });

  function tryOpen(pin){
    return fetch('/.netlify/functions/shop-admin', { headers:{'x-dashboard-pin':pin} }).then(function(r){ return r.ok; });
  }

  var existingPin = getPin();
  if(existingPin){
    tryOpen(existingPin).then(function(ok){
      if(ok){ gate.hidden=true; app.hidden=false; loadProducts(); }
    });
  }

  sb.auth.getSession().then(function(res){
    var session=res.data && res.data.session;
    var email=(session && session.user && session.user.email || '').toLowerCase();
    if(session && OWNER_EMAILS.indexOf(email)>=0){
      ownerToken=session.access_token;
      gate.hidden=true; app.hidden=false; loadProducts();
    }
  });

  document.getElementById('saGateSend').addEventListener('click', function(){
    var pin=document.getElementById('saGatePin').value.trim();
    var msg=document.getElementById('saGateMsg');
    if(!pin){ msg.textContent='Enter your PIN.'; return; }
    msg.textContent='Checking…';
    tryOpen(pin).then(function(ok){
      if(!ok){ msg.textContent='That PIN did not work.'; return; }
      setPin(pin);
      gate.hidden=true; app.hidden=false; loadProducts();
    });
  });
})();
</script>
</body>
</html>
